[package]
name = "inaturalist-client"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
futures = "0.3.34"
log = "0.4.34"
env_logger = "0.11.11"
rand = "0.10.3"
clap = { version = "4.6.7", features = ["derive"] }
async-trait = "0.1.92"
paste = "1.0.15"
csv = "1.4.0"

[lib]
name = "inaturalist_client"
path = "src/lib.rs"

[[bin]]
name = "inaturalist-cli"
path = "src/main.rs"