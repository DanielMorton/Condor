[package]
name = "inaturalist-client"
version = "0.2.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
async-trait = "0.1"
paste = "1.0"
backoff = { version = "0.4", features = ["tokio"] }
csv = "1.3"
indexmap = "2.2"

[lib]
name = "inaturalist_client"
path = "src/lib.rs"

[[bin]]
name = "inaturalist-cli"
path = "src/main.rs"