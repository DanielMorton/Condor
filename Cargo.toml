[package]
name = "condor"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.2", features = ["derive", "env"] }
csv = "1.4.0"
env_logger = "0.11.11"
futures = "0.3.33"
indicatif = "0.18.6"
log = "0.4.33"
rand = "0.10.2"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.53.0", features = ["full"] }
thiserror = "2.0.19"
chrono = { version = "0.4.45", features = ["serde"] }
